<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .one{
            border: 1px solid red;
        }
    </style>
</head>
<body>
    <table border="1" cellspacing="10" cellpadding="10">
        <!--only for alignmnent canot apply styles-->
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <th>4</th>
            <th>5</th>
            <th>6</th>
        </tr>
    </table>
    <hr>
    <table border="1" cellspacing="10" cellpadding="10">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <th rowspan="2">4</th>
            <th class="one" colspan="2">5</th>
            <!-- <th>6</th> -->
        </tr>
        <tr>
            <!-- <td>7</td> -->
            <td>8</td>
            <td>9</td>
        </tr>
    </table>
</body>
</html>
