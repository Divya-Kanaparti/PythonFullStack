<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <!-- <h1>Hello, world!</h1> -->
     <!-- we cannot use row and container together -->
     <!-- container-fluid -->
      <!-- one row has 12 columns by default -->
    <nav class="row bg-primary " style="height: 90px;">
        <div class="col-2 bg-danger"></div>
        <div class="col-5 bg-accent nav nav-pills" style="height: 100%; width: fit-content;">
            <!-- a{link$}*5 -->
             <a  class="nav-link bg-body fg-inverse">link1</a>
             <a  class="nav-link bg-body fg-inverse">link2</a> 
             <a  class="nav-link bg-body fg-inverse">link3</a>
             <a  class="nav-link bg-body fg-inverse">link4</a>
             <a  class="nav-link bg-body fg-inverse">link5</a>
        </div>
        <div class="col-3 bg-success"></div>
        <div class="col-2 bg-info"></div>
    </nav>
    <article class="row bg-warning" style="height: 60vh;">
        <div class="col-1 bg-primary"></div>
        <div class="col bg-inverse"></div>
        <div class="col-1 bg-success"></div>
    </article>
    <article class="row bg-success" style="height: 20vh;">
        <div class="col-3 bg-warning"></div>
        <div class="col-3 bg-info"></div>
        <div class="col-3 bg-success"></div>
        <div class="col-3 bg-danger"></div>
    </article>
    <article class="row bg-danger" style="height: 50vh;">
        <div class="col bg-info"></div>
        <div class="col bg-danger"></div>
        <div class="col bg-warning"></div>
        <div class="col bg-info"></div>
    </article>
    <footer class="row bg-primary" style="height: 50vh;">
        <div class="col bg-accent"></div>
        <div class="col bg-inverse"></div>
        <div class="col bg-primary"></div>
        <div class="col bg-success"></div>
        <div class="col bg-accent"></div>
    </footer>


    



    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  </body>
</html>
