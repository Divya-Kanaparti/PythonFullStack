<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Types of list
    unordered list=>types=disc,circle,square
    =>does not follow order/sequence
    ordered list types=alpha,decimal,roman
    =>maintains sequence
    attribute=>start=used to start the count
            =>style
    -->
    <ol type="A">
        <li>java</li>
        <li>Python</li>
        <li>Sql</li>
    </ol>
    <ol  type="A" start="4">
        <li>HTML</li>
        <li>CSS</li>
    </ol>
    <hr>
    <ul>
        <li>abc</li>
        <li>xyz</li>
    </ul>
    <ul type="circle">
        <li>tuv</li>
        <li>rst</li>
    </ul>
    <hr>
    <!--dl=decription list
    dt=description term
    dd=description defination-->
    <dl>
        <dt>name</dt>
        <dd>btech</dd>
    </dl>
</body>
</html>
